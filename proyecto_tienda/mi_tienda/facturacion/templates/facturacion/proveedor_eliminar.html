{% extends "base.html" %}
{% block titulo %}Eliminar proveedor{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="tarjeta text-center">
            <h1 class="h4 mb-3">¿Eliminar <span class="text-danger">{{ proveedor }}</span>?</h1>
            <p class="text-muted">Si el proveedor ya tiene compras, el sistema no te dejará eliminarlo.</p>
            <form method="post">                      {# POST → DeleteView.form_valid() #}
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'facturacion:proveedor_lista' %}" class="btn btn-outline-secondary">No, volver</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
